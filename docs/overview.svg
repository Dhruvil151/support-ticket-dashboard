t-size="15" fill="#bccbdc">Open → in progress → resolved</text><text x="40" y="307" font-family="Arial,sans-serif" font-size="13" fill="#97aabd">CONCEPTUAL WORKFLOW · DHRUVIL VASAVA</text></svg>
